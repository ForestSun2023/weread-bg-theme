# ============================================================================
# 静态关卡 CI
# ----------------------------------------------------------------------------
# 需要起无头浏览器的两关（功能回归 / 像素验证）**跑不了 CI** —— 它们依赖
# Windows + Edge，还需要不入库的阅读页快照（快照含整章小说正文，属版权内容）。
#
# 剩下五关是纯静态的，直接在 Linux runner 上跑：
#   1 封号风险审查 · 4 文档一致性 · 5 仓库卫生 · 6 死代码 · 7 体积
#
# 为什么拆成两个 step：
#   GitHub Actions 的**原始日志要登录且有 actions:read 才能取**，
#   但 **step 列表是公开可读的**（`GET /repos/{o}/{r}/actions/runs/{id}/jobs`）。
#   把第 1 关单独成步，就能不登录也看出「是哪一半挂了」。
#
# 为什么失败时还要贴提交评论：
#   提交评论同样公开可读，能拿到**完整输出**（比 step 粒度细得多）。
#   贴评论需要 `contents: write`，所以下面显式声明了最小权限。
# ============================================================================
name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # 只用于失败时贴提交评论

jobs:
  static:
    name: 静态关卡（五关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1 封号风险审查
        shell: pwsh
        run: ./工具/安全审查.ps1

      - name: 4-7 文档一致性 / 仓库卫生 / 死代码 / 体积
        id: check
        shell: pwsh
        # 先不中断：要让下一步有机会把输出贴出去
        continue-on-error: true
        run: |
          # 这一段的全部意义就是「无论如何都留下一份输出」。
          # 第一版写成 $out = (& ... | Out-String) 然后才写文件：结果脚本那一行抛了
          # 终止性错误，后面全没执行 → 评论里只有「(没有输出)」，诊断通道等于白建。
          # 所以：try/catch 兜住 + 先落盘再打印。
          $ErrorActionPreference = 'Continue'
          $code = 99
          try {
            $out = (& ./工具/交付检查.ps1 -SkipRegression 2>&1 | Out-String)
            $code = $LASTEXITCODE
            if (-not $out) { $out = '(脚本没有产生任何输出)' }
          } catch {
            $out = "调用交付检查时抛异常：`n$_`n`n$($_.ScriptStackTrace)"
          }
          "退出码 = $code" | Set-Content -Path check-output.txt -Encoding utf8
          $out | Add-Content -Path check-output.txt
          Get-Content check-output.txt -Raw | Write-Host

      - name: 失败时把完整输出贴到提交评论
        # ⚠️ 用 steps.check.outcome 而不是 failure()：
        #    上一步带 continue-on-error，failure() 不会为它触发。
        if: steps.check.outcome == 'failure' && github.event_name == 'push'
        continue-on-error: true      # 贴不上去也不该成为失败原因
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $raw = if (Test-Path check-output.txt) { Get-Content check-output.txt -Raw } else { '(没有输出)' }
          # 用 4 空格缩进做代码块，避免在 PowerShell 字符串里拼 Markdown 围栏
          $body = ($raw -split "`n" | ForEach-Object { "    $_" }) -join "`n"
          $text = "❌ 静态关卡未通过`n`n- 提交：${{ github.sha }}`n- 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n<details><summary>交付检查的完整输出</summary>`n`n$body`n`n</details>"
          $payload = @{ body = $text } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/commits/${{ github.sha }}/comments" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }

      - name: 让 job 真正失败
        # continue-on-error 会把整 job 的结论变成 success —— 那样徽标就在撒谎，这里补一刀。
        # 用 always() 保证即使上面贴评论那步自己挂了，这一步照样执行。
        if: always() && steps.check.outcome == 'failure'
        run: exit 1
