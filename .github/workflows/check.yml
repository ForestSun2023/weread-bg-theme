# ============================================================================
# CI：跑静态检查（Linux 上就能跑，见 工具/交付检查.ps1 的 -SkipRegression）
# ----------------------------------------------------------------------------
# 需要起无头浏览器的两关（功能回归 / 像素验证）跑不了 CI —— 它们依赖 Windows + Edge
# 和**不入库**的阅读页快照（快照含整章小说正文）。
#
# 推送后顺手让 jsDelivr 刷新 @main：它对分支引用有缓存，而脚本元数据的
# @updateURL/@downloadURL 都指向 @main —— 不刷的话用户最多要等缓存过期才拿到更新。
# ============================================================================
name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 交付检查（跳过需要浏览器的两关）
        shell: pwsh
        run: ./工具/交付检查.ps1 -SkipRegression

      - name: 让 jsDelivr 刷新 @main
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        run: |
          foreach ($p in @('weread-bg-theme.user.js','assets/icon-96.png')) {
            try {
              $r = Invoke-RestMethod -TimeoutSec 30 -Headers @{'User-Agent'='ci'} `
                -Uri "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$p"
              Write-Host "purge $p -> $($r.status)"
            } catch { Write-Host "purge $p 失败（不影响交付）：$($_.Exception.Message)" }
          }