# ============================================================================
# 静态关卡 CI
# ----------------------------------------------------------------------------
# 需要起无头浏览器的两关（功能回归 / 像素验证）**跑不了 CI** —— 它们依赖
# Windows + Edge，还需要不入库的阅读页快照（快照含整章小说正文，属版权内容）。
#
# 剩下五关是纯静态的，直接在 Linux runner 上跑：
#   1 封号风险审查 · 4 文档一致性 · 5 仓库卫生 · 6 死代码 · 7 体积
# `-SkipRegression` 这个开关本来就是为这个场景留的。
#
# 可移植性已逐项核对：`交付检查.ps1` 与 `安全审查.ps1` 零 `System.Drawing`、
# 零 `Add-Type`、无 Windows 专有路径写法（路径统一用 `/`，`git ls-files` 的输出
# 也不再被替换成反斜杠）。
#
# ⚠️ 注意：这一步会在 runner 的工作副本里往 `工具/审查记录.md` 追加一行（不会提交回来），
#    所以 CI 上看不到记录增长 —— 权威记录仍以本地 `工具/交付检查.ps1` 的提交为准。
# ============================================================================
name: 检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: 静态关卡（五关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 跑交付检查（跳过需要浏览器的两关）
        shell: pwsh
        run: ./工具/交付检查.ps1 -SkipRegression
